# Cloudflare Pages configuration for the Quantum Circuit Builder backend.
#
# The static site builds to dist/ (Vite). Pages Functions in /functions are
# served at the project root (e.g. https://qcb-6qe.pages.dev/api/...).

name = "qcb"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 database binding (variable name DB):
#   - Production: bind it in the Pages dashboard
#       Settings -> Functions -> D1 database bindings -> DB -> qcb
#     (kept out of this file so a placeholder id can't fail the build).
#   - Local dev: pass it on the CLI instead, e.g.
#       wrangler pages dev dist --d1 DB=qcb --binding WORKER_TOKEN=localsecret
#
# One-time, by the account owner:
#   wrangler d1 create qcb
#   wrangler d1 migrations apply qcb --remote
