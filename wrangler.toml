# Cloudflare Pages configuration for the Quantum Circuit Builder backend.
#
# The static site builds to dist/ (Vite). Pages Functions in /functions are
# served at the project root (e.g. https://qcb-6qe.pages.dev/api/...).

name = "qcb"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 binding (the functions read env.DB). The database_id is the real one
# from `wrangler d1 create qcb` — not a secret. This binds D1 for both the
# deployed Pages Functions and `wrangler d1 ...` / `wrangler pages dev`.
[[d1_databases]]
binding = "DB"
database_name = "qcb"
database_id = "39d9e8d2-fbf5-4fb9-8f25-95483f4f006b"

# Set WORKER_TOKEN (and optional ALLOWED_ORIGIN) as encrypted env vars in the
# Pages dashboard — secrets stay out of this file.
